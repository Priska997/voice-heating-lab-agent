services:
  restate:
    image: docker.restate.dev/restatedev/restate:1.7.2
    command: ["--node-name=restate-1"]
    ports:
      - "127.0.0.1:${RESTATE_INGRESS_HOST_PORT:-8080}:8080"
      - "127.0.0.1:${RESTATE_ADMIN_HOST_PORT:-9070}:9070"
    volumes:
      - restate-data:/restate-data

  runtime:
    build: .
    command: ["node", "dist/runtime/main.js"]
    environment:
      RESTATE_ENDPOINT_PORT: "9080"
      POLL_INTERVAL_MS: "${POLL_INTERVAL_MS:-1000}"
      MAXIMUM_OBSERVATION_GAP_MS: "${MAXIMUM_OBSERVATION_GAP_MS:-3000}"
      HEAT_UP_TIMEOUT_MS: "${HEAT_UP_TIMEOUT_MS:-600000}"
    depends_on:
      - restate

  register-runtime:
    image: curlimages/curl:8.16.0
    command:
      - -f
      - --retry
      - "20"
      - --retry-all-errors
      - --retry-delay
      - "1"
      - -H
      - "content-type: application/json"
      - -d
      - '{"uri":"http://runtime:9080"}'
      - http://restate:9070/deployments
    depends_on:
      - restate
      - runtime
    restart: "no"

  gateway:
    build: .
    command: ["node", "dist/gateway/main.js"]
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-3000}:3000"
    environment:
      GATEWAY_PORT: "3000"
      RESTATE_INGRESS_URL: http://restate:8080
    depends_on:
      register-runtime:
        condition: service_completed_successfully

volumes:
  restate-data:
